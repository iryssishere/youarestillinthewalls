<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Visual Novel Engine</title>

  <style>
    :root{
      --max-width:900px;
      --ui-pad:20px;
      --textbox-b;g: rgba(0,0,0,0.65);
      --textbox-color:#fff;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    html,body{
      margin:0;
      height:100%;
      background:#000;
      font-family:var(--font);
      color:var(--textbox-color);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
      box-sizing:border-box;
    }

    #game{
      width:100%;
      max-width:var(--max-width);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    #stage{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      background:#111;
      overflow:hidden;
      border-radius:12px;
    }

    #background{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .sprite{
      position:absolute;
      bottom:0;
      max-height:100%;
      transition:opacity .3s;
      pointer-events:none;
    }

    .left{ left:2%; }
    .right{ right:2%; }
    .hidden{ opacity:0; }

    #textbox{
      background:var(--textbox-bg);
      padding:var(--ui-pad);
      border-radius:12px;
      font-size:20px;
      min-height:80px;
      cursor:pointer;
    }

    .caret{
      display:inline-block;
      width:10px;
      height:1.1em;
      background:#fff;
      margin-left:6px;
      animation:blink 1s steps(1) infinite;
    }

    @keyframes blink{50%{opacity:0}}

    #choices{
      display:none;
      flex-direction:column;
      gap:8px;
    }

    .choice{
      background:#fff;
      color:#000;
      padding:12px;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div id="game">

    <div id="stage">
      <img id="background" src="" />
      <img id="spriteLeft" class="sprite left hidden"
        src="" />
      <img id="spriteRight" class="sprite right hidden"
        src="" />
    </div>

    <div id="textbox"></div>
    <div id="choices"></div>

  </div>
</div>

<script>
/* ===== ELEMENTS ===== */
const textbox = document.getElementById('textbox');
const choicesBox = document.getElementById('choices');
const bg = document.getElementById('background');
const leftSprite = document.getElementById('spriteLeft');
const rightSprite = document.getElementById('spriteRight');

/* ===== STATE ===== */
let typing = false;
let readyForNext = false;
let currentText = "";
let timer = null;
const speed = 28;

/* ===== ENGINE ===== */
function setBackground(src){ bg.src = src || ""; }

function setLeftSprite(src){
  if(src){ leftSprite.src = src; leftSprite.classList.remove('hidden'); }
  else leftSprite.classList.add('hidden');
}

function setRightSprite(src){
  if(src){ rightSprite.src = src; rightSprite.classList.remove('hidden'); }
  else rightSprite.classList.add('hidden');
}

function clearChoices(){
  choicesBox.innerHTML="";
  choicesBox.style.display="none";
}

function showChoices(list){
  clearChoices();
  choicesBox.style.display="flex";
  list.forEach(c=>{
    const btn=document.createElement('div');
    btn.className='choice';
    btn.textContent=c.text;
    btn.onclick=c.onSelect;
    choicesBox.appendChild(btn);
  });
}

function typeText(text){
  typing = true;
  readyForNext = false;
  currentText = text;
  textbox.innerHTML = "";

  const span = document.createElement('span');
  const caret = document.createElement('span');
  caret.className = "caret";
  textbox.append(span, caret);

  let i = 0;
  clearInterval(timer);
  timer = setInterval(()=>{
    span.textContent += text[i] || "";
    i++;
    if(i >= text.length){
      clearInterval(timer);
      typing = false;
      span.textContent = text;
      readyForNext = true;
    }
  }, speed);
}

function skipTyping(){
  if(!typing) return;
  clearInterval(timer);
  typing = false;
  textbox.innerHTML = currentText + '<span class="caret"></span>';
  readyForNext = true;
}

/* ===== TAP LOGIC ===== */
textbox.onclick = () => {
  if(typing){
    skipTyping();
    return;
  }
  if(readyForNext && choicesBox.style.display !== "flex"){
    readyForNext = false;
    nextScene();
  }
};

/* ===== STORY ===== */
let scene = 0;

function nextScene(){
  scene++;
  runScene();
}

function runScene(){
  clearChoices();

  switch(scene){
    case 0:
      setBackground("");
      setLeftSprite(null);
      setRightSprite(null);
      typeText("The beginning of my writings");
      break;

case 1:
      typeText("I buried each of them");
      break;

case 2:
      typeText("Those rottens who deserved it");
      break;

case 3:
      typeText("They all had the same rotten flesh inside themselves");
      break;

case 4:
      typeText("...");
      break;

case 5:
   typeText("14 Febuary 2025");
   break;

case 6:
setBackground("");
      typeText("You heard a notification from your socials, She had accepted your message request. She had accepted your message request. She had accepted your message request. She had accepted your message request. She had accepted your message request.");
      break;

case 7:
setRightSprite("");
      typeText("HER: WHOS THIS");
      break;

case 8:
setLeftSprite("");
setRightSprite("null");
      typeText("YOU: I'm your secret admirer");
      break;

case 9:
setLeftSprite("null");
setRightSprite("");
      typeText("HER: HAA WHAT");
      break;

case 10:
      typeText("HER: What a great starting text to a conversation");
      break;

case 11:
setLeftSprite("");
setRightSprite("null");
typeText("YOU: Mmmhm yeah..")
      break;

case 12:
setLeftSprite("null");
setRightSprite("");
      typeText("HER: BRO WHO ARE YOUUUU REALLY");
      break;

case 13:
   showChoices([
        { text:"(Change Topic)", onSelect:()=>{scene=14; runScene();} },
        { text:"Introduce Yourself", onSelect:()=>{scene=10; runScene();} }
      ]);
      typeText("...");
      break;

case 14:
setLeftSprite("");
setRightSprite("null");
      typeText("YOU: Oh well..");
      break;

case 15:
      showChoices([
      typeText("YOU: Which part of city are you in?")
      break;


  }
}

/* START */
runScene();
</script>
</body>
</html>
