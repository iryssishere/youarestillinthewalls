<body>
<div class="wrap">
  <div id="game">

    <div id="stage">
      <img id="background" src="" />
      <img id="spriteLeft" class="sprite left hidden"
        src="" />
      <img id="spriteRight" class="sprite right hidden"
        src="" />
    </div>

    <div id="textbox"></div>
    <div id="choices"></div>

  </div>
</div>

<script>
/* ===== ELEMENTS ===== */
const textbox = document.getElementById('textbox');
const choicesBox = document.getElementById('choices');
const bg = document.getElementById('background');
const leftSprite = document.getElementById('spriteLeft');
const rightSprite = document.getElementById('spriteRight');

/* ===== STATE ===== */
let typing = false;
let readyForNext = false;
let currentText = "";
let timer = null;
const speed = 28;

/* ===== ENGINE ===== */
function setBackground(src){ bg.src = src || ""; }

function setLeftSprite(src){
  if(src){ leftSprite.src = src; leftSprite.classList.remove('hidden'); }
  else leftSprite.classList.add('hidden');
}

function setRightSprite(src){
  if(src){ rightSprite.src = src; rightSprite.classList.remove('hidden'); }
  else rightSprite.classList.add('hidden');
}

function clearChoices(){
  choicesBox.innerHTML="";
  choicesBox.style.display="none";
}

function showChoices(list){
  clearChoices();
  choicesBox.style.display="flex";
  list.forEach(c=>{
    const btn=document.createElement('div');
    btn.className='choice';
    btn.textContent=c.text;
    btn.onclick=c.onSelect;
    choicesBox.appendChild(btn);
  });
}

function typeText(text){
  typing = true;
  readyForNext = false;
  currentText = text;
  textbox.innerHTML = "";

  const span = document.createElement('span');
  const caret = document.createElement('span');
  caret.className = "caret";
  textbox.append(span, caret);

  let i = 0;
  clearInterval(timer);
  timer = setInterval(()=>{
    span.textContent += text[i] || "";
    i++;
    if(i >= text.length){
      clearInterval(timer);
      typing = false;
      span.textContent = text;
      readyForNext = true;
    }
  }, speed);
}

function skipTyping(){
  if(!typing) return;
  clearInterval(timer);
  typing = false;
  textbox.innerHTML = currentText + '<span class="caret"></span>';
  readyForNext = true;
}

/* ===== TAP LOGIC ===== */
textbox.onclick = () => {
  if(typing){
    skipTyping();
    return;
  }
  if(readyForNext && choicesBox.style.display !== "flex"){
    readyForNext = false;
    nextScene();
  }
};

/* ===== STORY ===== */
let scene = 0;

function nextScene(){
  scene++;
  runScene();
}

function runScene(){
  clearChoices();

  switch(scene){
    case 0:
      setBackground("https://imgur.com/a/hYgrAJB");
      setLeftSprite(null);
      setRightSprite(null);
      typeText("Their idea of love will never be genuine");
      break;

case 1:
      typeText("They will also never truly understand");
      break;

case 2:
      typeText("I wanted to be the only one, I had to be the only one, No one should be able to");
      break;

case 3:
      typeText("But you were impure and you made yourself into being deemed a rotten");
      break;

case 4:
      typeText("I still saved you, Even when you were constantly trying to be, It was not my fault");
      break;

case 5:
   typeText("The grief still haunts this day; I regretted everything");
   break;

case 6:
setBackground("https://i.postimg.cc/d18B21KF/IMG-20251118-191115-188.webp");
      typeText("You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls You will forever be in the walls 6 JULY 2025");
      break;


  }
}

/* START */
runScene();
</script>
